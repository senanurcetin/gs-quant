# The application behind Caddy, from the published image: no checkout of the repository is needed, only this file and
# the Caddyfile next to it (https://github.com/senanurcetin/gs-quant/tree/master/deploy).
#
#   export RISK_APP_DOMAIN=risk.example.com              # a name that points at this machine, ports 80 and 443 open
#   export RISK_APP_API_TOKEN="$(python3 -c 'import secrets; print(secrets.token_urlsafe(24))')"
#   export RISK_APP_VERSION=0.1.0                        # a published version; "latest" follows the newest release
#   docker compose -f docker-compose.image.yml up -d
#
# The saved analyses and portfolios are in the risk-data volume: copy runs.db to back them up.
services:
  app:
    image: ghcr.io/senanurcetin/gs-quant-risk:${RISK_APP_VERSION:-latest}
    restart: unless-stopped
    environment:
      RISK_APP_API_TOKEN: ${RISK_APP_API_TOKEN:?set RISK_APP_API_TOKEN to 16 or more characters}
      RISK_APP_TRUST_PROXY: "1" # the only way in is through Caddy, which sets X-Forwarded-For
    volumes:
      - risk-data:/data
    expose:
      - "8000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    environment:
      RISK_APP_DOMAIN: ${RISK_APP_DOMAIN:?set RISK_APP_DOMAIN to the name of this server}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

volumes:
  risk-data:
  caddy-data:
