name: Verify GS Quant umbrella after deduplication
on:
  push:
    branches:
      - verify/gs400-decomposition-20261020
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GS Quant and validation requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,mcp,app]" ruff
      - name: Run focused remaining lazy-default regressions
        run: python -m pytest -q gs_quant/test/test_lazy_defaults.py --disable-warnings --maxfail=1
      - name: Run full GS Quant suite
        run: python -m pytest -q gs_quant/test --disable-warnings --maxfail=1
      - name: Lint changed Python files only
        if: always()
        run: |
          git diff --name-only bbe7071653ccfc0d431e11c3a31dbd511afc394f HEAD -- '*.py' | xargs -r python -m ruff check
