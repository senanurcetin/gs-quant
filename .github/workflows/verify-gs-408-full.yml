name: Verify GS Quant 408 full test suite
on:
  push:
    branches:
      - verify/gs-quant-408-full-20261019
permissions:
  contents: read
jobs:
  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,mcp,app]"
      - name: Compile changed session files with warnings as errors
        run: python -W error::SyntaxWarning -W error::DeprecationWarning -m py_compile gs_quant/session.py gs_quant/test/test_session.py
      - name: Compile full package (report upstream warnings separately)
        run: python -m compileall -q gs_quant
      - name: Run full test suite
        run: python -m pytest -q gs_quant/test --disable-warnings --maxfail=1
      - name: Ruff changed files
        run: python -m ruff check gs_quant/session.py gs_quant/test/test_session.py
