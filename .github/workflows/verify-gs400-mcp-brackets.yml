name: Verify isolated GS Quant MCP bracket escapes
on:
  push:
    branches:
      - verify/gs400-mcp-brackets-clean-20261020
permissions:
  contents: read
jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GS Quant with test and MCP dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,mcp,app]" ruff
      - name: Run focused regression tests
        run: python -m pytest -q gs_quant/test/test_mcp_middleware_bracket_escapes.py --disable-warnings --maxfail=1
      - name: Run full regression suite
        run: python -m pytest -q gs_quant/test --disable-warnings --maxfail=1
      - name: Lint touched files
        if: always()
        run: python -m ruff check gs_quant/mcp/middleware.py gs_quant/test/test_mcp_middleware_bracket_escapes.py
