name: Verify isolated GS Quant IANA timezones
on:
  push:
    branches:
      - verify/gs400-timezone-20261020
permissions:
  contents: read
jobs:
  complete-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GS Quant and test requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,mcp,app]" ruff
      - name: Test isolated change
        run: python -m pytest -q gs_quant/test/timeseries/test_event_study.py gs_quant/test/timeseries/test_measures.py --disable-warnings --maxfail=1
      - name: Full integration suite (recheck after upstream test recovered)
        run: python -m pytest -q gs_quant/test --disable-warnings --maxfail=1
      - name: Ruff touched source files
        if: always()
        run: python -m ruff check gs_quant/timeseries/measures.py gs_quant/test/timeseries/test_event_study.py gs_quant/test/timeseries/test_measures.py
