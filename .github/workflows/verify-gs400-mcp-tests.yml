name: Verify extracted GS Quant MCP tests
on:
  push:
    branches:
      - verify/gs400-mcp-tests-20261021
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,mcp,app]" ruff
      - name: MCP focused regression suite
        run: python -m pytest -q gs_quant/test/mcp --disable-warnings --maxfail=1
      - name: Ruff MCP regression tests
        if: always()
        run: python -m ruff check gs_quant/test/mcp
