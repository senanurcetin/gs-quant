name: Verify isolated GS Quant date and time fixes
on:
  push:
    branches:
      - verify/gs400-date-time-20261021
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,mcp,app]" ruff
      - name: Targeted lazy-default regressions
        run: python -m pytest -q gs_quant/test/test_lazy_defaults.py gs_quant/test/timeseries/test_event_study.py --disable-warnings --maxfail=1
      - name: Full regression suite
        run: python -m pytest -q gs_quant/test --disable-warnings --maxfail=1
      - name: Ruff changed Python files
        if: always()
        run: |
          git diff --name-only --diff-filter=ACMR bbe7071653ccfc0d431e11c3a31dbd511afc394f HEAD -- '*.py' | xargs -r python -m ruff check
