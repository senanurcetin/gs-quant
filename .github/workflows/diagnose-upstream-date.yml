name: Diagnose upstream date-dependent configuration test
on:
  push:
    branches:
      - verify/gs400-upstream-date-test-20261020
permissions:
  contents: read
jobs:
  upstream-baseline-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install baseline test requirements
        run: python -m pip install -e ".[test,mcp,app]"
      - name: Record outcome on unmodified upstream production and test code
        shell: bash
        run: |
          set +e
          python -m pytest -q gs_quant/test/config/test_options.py::test_display_options --disable-warnings > /tmp/upstream-date-test.log 2>&1
          code=$?
          set -e
          cat /tmp/upstream-date-test.log
          echo "BASELINE_TEST_EXIT_CODE=$code"
          if [ "$code" -eq 0 ]; then
            echo "BASELINE_PASSED: date failure not reproduced on upstream"
          elif grep -q 'DID NOT RAISE TypeError' /tmp/upstream-date-test.log; then
            echo "BASELINE_REPRODUCED: expected date-dependent fixture failure"
          else
            echo "BASELINE_FAILED_DIFFERENTLY: investigate before attributing"
            exit 1
          fi
