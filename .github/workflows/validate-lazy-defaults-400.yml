name: Validate lazy defaults from GS Quant 400

on:
  push:
    branches:
      - verify/umbrella-400-lazy-defaults

permissions:
  contents: read

concurrency:
  group: lazy-defaults-400-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GS Quant and test dependencies
        run: python -m pip install -e . pytest pytest-mock freezegun testfixtures ruff
      - name: Validate lazy defaults and clock-dependent signatures
        run: python -m pytest -q gs_quant/test/test_lazy_defaults.py
      - name: Ruff lint lazy defaults code and tests
        run: python -m ruff check gs_quant/lazy_defaults.py gs_quant/test/test_lazy_defaults.py
