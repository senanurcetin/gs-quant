name: Verify GS Quant explicit LazyDefault contracts
on:
  push:
    branches:
      - verify/gs400-explicit-marker-20261021
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,mcp,app]" ruff
      - name: Focused LazyDefault tests
        run: python -m pytest -q gs_quant/test/test_lazy_defaults.py --disable-warnings --maxfail=1
      - name: Full GS Quant test suite
        run: python -m pytest -q gs_quant/test --disable-warnings --maxfail=1
      - name: Ruff on QA sources and tests
        if: always()
        run: |
          python -m ruff check gs_quant/lazy_defaults.py gs_quant/test/test_lazy_defaults.py
