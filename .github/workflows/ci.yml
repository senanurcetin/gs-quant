name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_call: # run by release.yml before a release is published

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install ruff
        run: python -m pip install ruff
      - name: Lint
        run: ruff check gs_quant
      - name: Check formatting
        run: ruff format --check gs_quant

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,mcp,app]"
      - name: Fail on invalid escape sequences and other compile-time warnings
        run: python -W error::SyntaxWarning -W error::DeprecationWarning -m compileall -q gs_quant
      - name: Run tests
        run: python -m pytest gs_quant/test -q

  browser:
    name: Browser test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,mcp,app]" playwright axe-playwright-python
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Drive the application in a real browser
        # RISK_APP_REQUIRE_BROWSER makes a missing browser a failure instead of a skip
        env:
          RISK_APP_REQUIRE_BROWSER: '1'
        run: python -m pytest gs_quant/test/apps/test_risk_dashboard_browser.py -q -rs

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the image
        run: docker build -t gs-quant-risk .
      - name: Refuses to listen on the network without a token
        run: |
          if docker run --rm gs-quant-risk; then echo "expected the container to refuse to start"; exit 1; fi
      - name: Serves with a token
        run: |
          docker run -d --name risk -p 8000:8000 -e RISK_APP_API_TOKEN=ci-token-0123456789 gs-quant-risk
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8000/api/health && break; sleep 2; done
          curl -fs http://127.0.0.1:8000/api/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/runs)" = 401
          curl -fs -H 'Authorization: Bearer ci-token-0123456789' http://127.0.0.1:8000/api/runs
      - name: Reports the version it is given
        run: |
          docker build --build-arg VERSION=9.8.7 -t gs-quant-risk:versioned .
          docker run -d --name versioned -p 8001:8000 -e RISK_APP_API_TOKEN=ci-token-0123456789 gs-quant-risk:versioned
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8001/api/health && break; sleep 2; done
          test "$(curl -fs http://127.0.0.1:8001/api/health | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')" = "9.8.7"
          docker rm -f versioned
      - name: Scan the image for known vulnerabilities
        # informational: it lists what the base image and the dependencies carry, and never fails the build
        continue-on-error: true
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 gs-quant-risk
      - name: Container logs
        if: always()
        run: docker logs risk || true
