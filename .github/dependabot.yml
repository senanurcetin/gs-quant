# Dependency updates: a pull request a week at most, grouped, for the actions the workflows use and for the Python packages
# the application depends on. They run the same checks as any other pull request.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      python-packages:
        update-types: [minor, patch]
